name: iOS build a testy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: # rucni spusteni z GitHubu nebo `gh workflow run ios.yml`

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    # macos-26 (ARM) mel dlouhodobe plnou frontu ("capacity constraints"),
    # Intel varianta ma stejny Xcode 26 a jinou skupinu stroju.
    runs-on: macos-26-intel
    timeout-minutes: 60
    env:
      # Cislo buildu (CFBundleVersion) roste s kazdym behem CI.
      BUILD_NUMBER: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v5

      - name: Verze Xcode
        run: xcodebuild -version

      - name: Instalace XcodeGen
        run: brew install xcodegen

      - name: Vygenerovani Xcode projektu z project.yml
        run: xcodegen generate

      # IPA se sestavi PRED testy, aby byla ke stazeni i kdyz nejaky test spadne.
      - name: Sestaveni IPA pro iPhone (nepodepsana)
        run: bash scripts/ci-build-ipa.sh

      - name: Nahrani IPA
        uses: actions/upload-artifact@v4
        with:
          name: FocusQuest-ipa
          path: build/FocusQuest.ipa
          retention-days: 14

      # Release (konfigurace pro App Store) se jen zkompiluje: bez #if DEBUG kodu musi projit taky.
      - name: Kontrola Release buildu (jen kompilace)
        run: CONFIG=Release COMPILE_ONLY=1 bash scripts/ci-build-ipa.sh

      - name: Unit testy na iOS simulatoru
        run: bash scripts/ci-test.sh

      - name: Screenshot aplikace ze simulatoru
        if: success() || failure()
        continue-on-error: true
        # Vlastni limit kroku: kdyz se simulator zasekne, screenshoty se i tak nahraji
        # a build nespadne na limit celeho jobu.
        timeout-minutes: 28
        run: bash scripts/ci-screenshot.sh

      - name: Nahrani screenshotu
        if: success() || failure()
        uses: actions/upload-artifact@v4
        with:
          name: screenshoty
          path: build/screenshots/
          if-no-files-found: ignore
          retention-days: 14

      - name: Nahrani logu (pri chybe)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: logy
          path: |
            build/*.log
            build/TestResults.xcresult
          retention-days: 7
