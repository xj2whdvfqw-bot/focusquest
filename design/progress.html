  :root {

    --s-pracuje: #5aa9ff;
    --s-build: #ffc14d;
    --s-spadl: #ff5466;
    --s-hotovo: #6be6c7;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text); }
  body {
    font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, system-ui, sans-serif;
    padding: 24px 16px 48px;
  }
  main { max-width: 860px; margin: 0 auto; }
  h1 { font-size: 24px; margin: 0 0 4px; letter-spacing: .01em; }
  .sub { color: var(--text3); font-size: 13px; margin: 0 0 20px; }
  code { font-family: ui-monospace, SFMono-Regular, Consolas, monospace; font-size: .92em; background: var(--card-2); padding: 1px 5px; border-radius: 5px; }

  .summary { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 18px; margin-bottom: 24px; }
  .count { font-size: 20px; font-weight: 700; margin-bottom: 10px; }
  .count span { color: var(--accent); }
  .bar { height: 12px; background: var(--card-2); border-radius: 99px; overflow: hidden; display: flex; }
  .bar i { display: block; height: 100%; }
  .legend { display: flex; flex-wrap: wrap; gap: 6px 14px; margin-top: 10px; font-size: 13px; color: var(--text2); }
  .legend b { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 6px; vertical-align: 1px; }
  .meta { display: grid; grid-template-columns: max-content 1fr; gap: 6px 14px; margin-top: 16px; font-size: 14px; }
  .meta dt { color: var(--text3); }
  .meta dd { margin: 0; }

  .grid { display: grid; gap: 14px; }
  .sec { background: var(--card); border: 1px solid var(--line); border-left: 4px solid var(--c); border-radius: 14px; padding: 16px; }
  .sec.current { box-shadow: 0 0 0 2px var(--c); }
  .sec-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
  .sec h2 { font-size: 17px; margin: 0; line-height: 1.3; }
  .sec h2 small { color: var(--text3); font-weight: 600; margin-right: 6px; }
  .pill { flex: none; font-size: 12px; font-weight: 700; padding: 3px 10px; border-radius: 99px; color: #0b0a16; background: var(--c); white-space: nowrap; }
  .done-count { font-size: 13px; color: var(--text3); margin: 4px 0 10px; }
  ul.items { list-style: none; margin: 0; padding: 0; }
  ul.items li { display: flex; gap: 10px; padding: 5px 0; color: var(--text2); }
  ul.items li.ok { color: var(--text); }
  .box { flex: none; width: 18px; height: 18px; margin-top: 2px; border-radius: 5px; border: 1.5px solid var(--text3); display: grid; place-items: center; font-size: 12px; font-weight: 800; }
  li.ok .box { background: var(--accent); border-color: var(--accent); color: #0b0a16; }
  .info { display: flex; flex-wrap: wrap; gap: 6px 18px; margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--line); font-size: 13px; color: var(--text2); }
  .info a { color: var(--s-pracuje); }
  .note { margin-top: 10px; font-size: 14px; color: var(--text2); background: var(--card-2); border-radius: 10px; padding: 10px 12px; }
  .note b { color: var(--text); }

  .next { margin-top: 24px; background: var(--card); border: 1px solid var(--accent); border-radius: 16px; padding: 18px; }
  .next h2 { margin: 0 0 6px; font-size: 15px; color: var(--accent); text-transform: uppercase; letter-spacing: .08em; }
  .next p { margin: 0; font-size: 17px; font-weight: 600; }
  .err { color: var(--s-spadl); }
</style>
</head>

<script>
(function () {
  var STATUS = {
    cekam:   { label: "Čeká",        color: "var(--s-cekam)" },
    pracuje: { label: "Pracuje se",  color: "var(--s-pracuje)" },
    build:   { label: "Build běží",  color: "var(--s-build)" },
    spadl:   { label: "Build spadl", color: "var(--s-spadl)" },
    hotovo:  { label: "Hotovo",      color: "var(--s-hotovo)" }
  };
  var ORDER = ["hotovo", "build", "spadl", "pracuje", "cekam"];

  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  // `kód` v textu se vykreslí jako <code>
  function rich(s) { return esc(s).replace(/`([^`]+)`/g, "<code>$1</code>"); }

  var app = document.getElementById("app");
  var d;
  try {
    d = JSON.parse(document.getElementById("data").textContent);
  } catch (e) {
    app.innerHTML = '<p class="err">Chyba v JSON bloku s daty: ' + esc(e.message) + "</p>";
    return;
  }

  var secs = d.sections || [];
  var total = secs.length;
  var counts = {};
  secs.forEach(function (s) { counts[s.status] = (counts[s.status] || 0) + 1; });
  var done = counts.hotovo || 0;

  var updated = d.updated ? new Date(d.updated) : null;
  var updatedText = updated && !isNaN(updated)
    ? updated.toLocaleString("cs-CZ", { timeZone: "Europe/Prague", day: "numeric", month: "numeric", year: "numeric", hour: "2-digit", minute: "2-digit" })
    : "neznámé";

  var bar = ORDER.map(function (k) {
    var n = counts[k] || 0;
    if (!n || k === "cekam") return "";
    return '<i style="width:' + (n / total * 100) + "%;background:" + STATUS[k].color + '"></i>';
  }).join("");
  var legend = ORDER.filter(function (k) { return counts[k]; }).map(function (k) {
    return '<span><b style="background:' + STATUS[k].color + '"></b>' + STATUS[k].label + ": " + counts[k] + "</span>";
  }).join("");

  var html = "";
  html += "<h1>FocusQuest: přepis designu do Swiftu</h1>";
  html += '<p class="sub">Podle <code>design/CHANGES.md</code>. Stránka se sama obnovuje každých 30 s.</p>';

  html += '<section class="summary">';
  html += '<div class="count"><span>' + done + "</span> z " + total + " sekcí hotovo</div>";
  html += '<div class="bar" role="img" aria-label="' + done + " z " + total + ' sekcí hotovo">' + bar + "</div>";
  html += '<div class="legend">' + legend + "</div>";
  html += '<dl class="meta"><dt>Právě se pracuje na</dt><dd>' + esc(d.current || "nic") + "</dd>";
  html += "<dt>Poslední aktualizace</dt><dd>" + esc(updatedText) + "</dd></dl>";
  html += "</section>";

  html += '<div class="grid">';
  secs.forEach(function (s) {
    var st = STATUS[s.status] || STATUS.cekam;
    var items = s.items || [];
    var nDone = items.filter(function (i) { return i.done; }).length;
    var isCurrent = d.current && new RegExp("\\b" + s.id + "\\b").test(d.current) && s.status !== "cekam" && s.status !== "hotovo";

    html += '<article class="sec' + (isCurrent ? " current" : "") + '" style="--c:' + st.color + '">';
    html += '<div class="sec-head"><h2><small>' + s.id + ".</small>" + esc(s.title) + '</h2><span class="pill">' + st.label + "</span></div>";
    html += '<div class="done-count">' + nDone + " z " + items.length + " bodů hotovo</div>";
    html += '<ul class="items">';
    items.forEach(function (i) {
      html += "<li" + (i.done ? ' class="ok"' : "") + '><span class="box" aria-hidden="true">' + (i.done ? "✓" : "") + "</span><span>" + rich(i.text) + "</span></li>";
    });
    html += "</ul>";

    var info = [];
    info.push("Commit: " + (s.commit ? '<a href="' + esc(d.repo) + "/commit/" + esc(s.commit) + '"><code>' + esc(s.commit) + "</code></a>" : "–"));
    if (s.build && s.build.number) {
      var link = s.build.runId ? '<a href="' + esc(d.repo) + "/actions/runs/" + esc(s.build.runId) + '">#' + esc(s.build.number) + "</a>" : "#" + esc(s.build.number);
      info.push("Build: " + link + " · " + esc(s.build.result || "?"));
    } else {
      info.push("Build: –");
    }
    html += '<div class="info"><span>' + info.join("</span><span>") + "</span></div>";
    if (s.note) html += '<div class="note"><b>Poznámka:</b> ' + rich(s.note) + "</div>";
    html += "</article>";
  });
  html += "</div>";

  html += '<section class="next"><h2>Další krok</h2><p>' + rich(d.nextStep || "") + "</p></section>";
  app.innerHTML = html;
})();
</script>
